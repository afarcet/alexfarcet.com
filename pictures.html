    <style>
/* ============================================================
   PICTURES — v2
   ============================================================ */
.pictures2-page{max-width:900px;margin:0 auto;animation:fadeIn 0.8s ease-out}

.pictures2-title{
    font-family:'Cormorant',serif;
    font-size:2.2rem;font-weight:400;line-height:1.3;
    margin-bottom:16px;letter-spacing:-0.02em;
}
.pictures2-intro{
    color:var(--text-light);
    margin-bottom:48px;
    max-width:480px;
}

/* ---------- Featured row ---------- */
.featured-section{
    position:relative;
    margin-bottom:64px;
}
.featured-scroller{
    display:flex;
    gap:12px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    padding-bottom:12px;
    /* Hide scrollbar */
    scrollbar-width:none;
    -ms-overflow-style:none;
    cursor:grab;
    -webkit-user-select:none;user-select:none;
}
.featured-scroller.dragging{cursor:grabbing;scroll-behavior:auto}
.featured-scroller::-webkit-scrollbar{display:none}

.featured-item{
    /* Exactly 3 items fit the container width (2 * 12px gaps between them) */
    flex:0 0 calc((100% - 24px) / 3);
    aspect-ratio:3/4;
    scroll-snap-align:start;
    position:relative;
    border-radius:4px;
    overflow:hidden;
    cursor:zoom-in;
    background:#e0dbcf;
    transition:transform 0.3s ease;
}
.featured-item:hover{transform:translateY(-2px)}
.featured-item img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    filter:saturate(0.98);
}
.featured-item .featured-caption{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:40px 16px 14px;
    background:linear-gradient(to top,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.25) 60%,transparent 100%);
    color:#fff;
    font-family:'Cormorant',serif;font-style:italic;
    font-size:1.05rem;
    line-height:1.3;
    letter-spacing:0.01em;
    pointer-events:none;
}
.featured-item .featured-caption em{
    display:block;
    font-family:'DM Sans',sans-serif;font-style:normal;
    font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;
    opacity:0.75;margin-bottom:3px;
}

/* iPhoto-style navigation arrows */
.featured-arrow{
    position:absolute;
    top:50%;transform:translateY(-50%);
    width:38px;height:38px;
    border-radius:50%;
    background:rgba(26,26,26,0.55);
    border:none;
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:5;
    padding:0;
    transition:opacity 0.25s, background 0.2s, transform 0.2s;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    font-family:'DM Sans',sans-serif;
    font-size:1.1rem;line-height:1;
    opacity:0;pointer-events:none;
}
.featured-section.has-left .featured-arrow.prev,
.featured-section.has-right .featured-arrow.next{
    opacity:1;
    pointer-events:auto;
}
.featured-arrow:hover{
    background:rgba(26,26,26,0.85);
    transform:translateY(-50%) scale(1.05);
}
.featured-arrow:active{transform:translateY(-50%) scale(0.95)}
.featured-arrow.prev{left:-8px}
.featured-arrow.next{right:-8px}
.featured-arrow svg{width:14px;height:14px;fill:currentColor}

/* Scroll progress dots */
.featured-progress{
    display:flex;gap:6px;
    justify-content:center;
    padding-top:8px;
    min-height:5px;
}
.featured-progress .p-dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--border);
    transition:background 0.3s,transform 0.3s;
}
.featured-progress .p-dot.active{
    background:var(--text-light);
    transform:scale(1.2);
}
/* Hide progress dots when there's nothing to scroll to */
.featured-section:not(.has-left):not(.has-right) .featured-progress{visibility:hidden}

/* ---------- Library ---------- */
.library{margin-bottom:64px}
.library-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:20px;flex-wrap:wrap;gap:12px;
}
.library-title{
    font-family:'Cormorant',serif;
    font-size:1.6rem;font-weight:400;letter-spacing:-0.01em;
}
.library-count{
    font-family:'DM Sans',sans-serif;
    font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--text-light);
}

.location-menu{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:32px;
}
.loc-chip{
    background:none;
    border:1px solid var(--border);
    color:var(--text-light);
    font-family:'DM Sans',sans-serif;
    font-size:0.78rem;letter-spacing:0.03em;
    padding:6px 14px;border-radius:16px;
    cursor:pointer;transition:all 0.25s;
}
.loc-chip:hover{color:var(--text);border-color:var(--text)}
.loc-chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.loc-chip .loc-count{
    opacity:0.55;margin-left:6px;font-size:0.7rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    animation:fadeIn 0.5s ease-out;
}
.grid-item{
    aspect-ratio:1;
    background:#e0dbcf;
    border-radius:3px;
    overflow:hidden;
    cursor:zoom-in;
    position:relative;
    transition:transform 0.3s;
}
.grid-item:hover{transform:translateY(-2px)}
.grid-item img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(12%);
    transition:filter 0.4s;
    pointer-events:none;
}
.grid-item:hover img{filter:grayscale(0)}

.empty-msg{
    padding:40px 0;
    text-align:center;
    color:var(--text-light);
    font-family:'Cormorant',serif;font-style:italic;
    font-size:1.1rem;
}

/* ---------- Lightbox ---------- */
.lightbox{
    position:fixed;inset:0;
    background:rgba(15,14,12,0.94);
    z-index:1000;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s;
    padding:32px;
}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox-img-wrap{
    max-width:100%;max-height:78vh;
    display:flex;align-items:center;justify-content:center;
    animation:lbFadeIn 0.35s ease-out;
}
.lightbox-img{
    max-width:100%;max-height:78vh;
    object-fit:contain;
    border-radius:2px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
@keyframes lbFadeIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}

.lightbox-meta{
    margin-top:20px;
    text-align:center;
    color:#f5f2ea;
    max-width:640px;
}
.lightbox-caption{
    font-family:'Cormorant',serif;font-style:italic;
    font-size:1.25rem;
    line-height:1.4;
    margin-bottom:6px;
}
.lightbox-loc{
    font-family:'DM Sans',sans-serif;
    font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;
    color:rgba(245,242,234,0.55);
}

.lightbox-close{
    position:absolute;top:20px;right:24px;
    background:none;border:none;
    color:rgba(245,242,234,0.7);
    font-size:1.4rem;font-family:'DM Sans',sans-serif;
    cursor:pointer;padding:8px;
    line-height:1;
    transition:color 0.2s;
}
.lightbox-close:hover{color:#fff}

.lightbox-nav{
    position:absolute;top:50%;
    background:none;border:none;
    color:rgba(245,242,234,0.5);
    font-family:'Cormorant',serif;font-size:2rem;font-weight:300;
    cursor:pointer;
    padding:16px 20px;
    transition:color 0.2s,transform 0.2s;
    transform:translateY(-50%);
    line-height:1;
}
.lightbox-nav:hover{color:#fff;transform:translateY(-50%) scale(1.05)}
.lightbox-nav.prev{left:16px}
.lightbox-nav.next{right:16px}
.lightbox-counter{
    position:absolute;bottom:24px;left:0;right:0;
    text-align:center;
    color:rgba(245,242,234,0.4);
    font-family:'DM Sans',sans-serif;
    font-size:0.7rem;letter-spacing:0.2em;
}

body.lb-open{overflow:hidden}

/* ---------- Mobile ---------- */
@media (max-width:800px){
    /* Show ~2 items at once with a peek of the third */
    .featured-item{flex:0 0 calc((100% - 12px) / 2)}
    .featured-item .featured-caption{font-size:1rem;padding:36px 14px 12px}
    .featured-arrow{width:32px;height:32px}
    .featured-arrow svg{width:12px;height:12px}
    .grid{grid-template-columns:repeat(2,1fr);gap:8px}
    .library-title{font-size:1.35rem}
    .lightbox{padding:16px}
    .lightbox-img-wrap,.lightbox-img{max-height:70vh}
    .lightbox-caption{font-size:1.05rem}
    .lightbox-nav{font-size:1.5rem;padding:12px 14px}
    .lightbox-nav.prev{left:4px}
    .lightbox-nav.next{right:4px}
}
@media (max-width:500px){
    /* Show 1 item at full width */
    .featured-item{flex:0 0 100%}
    .featured-item .featured-caption{font-size:1.1rem}
}
    </style>
</head>
<body>
    <nav class="side-nav">
        <a href="pictures.html" class="nav-link nav-link-active">Pictures</a>

    <div class="container">

        <main class="pictures2-page">
            <h2 class="pictures2-title">Pictures</h2>

            <!-- Featured horizontal scroller -->
            <section class="featured-section" id="featuredSection">
                <button class="featured-arrow prev" id="featuredPrev" aria-label="Previous photos">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6z"/></svg>

        <button class="lightbox-nav prev" id="lbPrev" aria-label="Previous photo">‹</button>

            <img class="lightbox-img" id="lbImg" alt="">
        </div>
        <div class="lightbox-meta">
            <div class="lightbox-caption" id="lbCaption"></div>
            <div class="lightbox-loc" id="lbLoc"></div>
        </div>
        <button class="lightbox-nav next" id="lbNext" aria-label="Next photo">›</button>
        <div class="lightbox-counter" id="lbCounter"></div>
    </div>

    <script>
    (function(){
        /* ============================================================
           PHOTO MANIFEST
           Photos live on disk in /photos/<folder>/ — one folder per location.
           This manifest just tells the page which files are in each folder
           and (optionally) captions the ones worth captioning.

           TO ADD photos:
              1. Drop the file into /photos/featured/ or /photos/<location>/
              2. Add one line here in the matching section.
              3. Push. Done.
           TO MOVE a photo to a new location: move the file on disk AND move
              its entry to the other location's array here.
           TO CREATE a new location: add a "photos/newlocation/" folder,
              then add a "NewLocation": [ ... ] entry to LIBRARY below.
           ============================================================ */

        var FEATURED = [
            { file:"roots-run-deep.jpeg",         caption:"Roots run deep",         location:"Brazil" },
            { file:"moss-and-stone-kyoto.jpeg",   caption:"Moss and stone, Kyoto",  location:"Japan"  },
            { file:"floralis-buenos-aires.jpeg",  caption:"Floralis, Buenos Aires", location:"Argentina" }
        ];

        var LIBRARY = {
            "Portugal":  [
                /* files in /photos/portugal/ */
            ],
            "Brazil":    [
                { file:"IMG_0750.jpeg" },
                { file:"IMG_0812.jpeg" },
                { file:"IMG_0880.jpeg" },
                { file:"IMG_0891.jpeg" },
                { file:"IMG_0932.jpeg" },
                { file:"IMG_0941.jpeg" },
                { file:"IMG_0993.jpeg" },
                { file:"IMG_1019.jpeg" },
                { file:"IMG_1039.jpeg" },
                { file:"IMG_1043.jpeg" },
                { file:"IMG_1065.jpeg" },
                { file:"IMG_1106.jpeg" },
                { file:"IMG_1107.jpeg" },
                { file:"IMG_1157.jpeg" },
                { file:"IMG_1164.jpeg" },
                { file:"IMG_1187.jpeg" },
                { file:"IMG_1191.jpeg" },
                { file:"IMG_1212.jpeg" },
                { file:"IMG_1220.jpeg" },
                { file:"IMG_1265.jpeg" },
                { file:"IMG_1271.jpeg" },
                { file:"IMG_1281.jpeg" },
                { file:"IMG_1511.jpeg" },
                { file:"IMG_1543.jpeg" },
                { file:"IMG_1616.jpeg" },
                { file:"IMG_1668.jpeg" },
                { file:"IMG_1817.jpeg" },
                { file:"IMG_1828.jpeg" },
                { file:"IMG_1877.jpeg" },
                { file:"IMG_1894.jpeg" },
                { file:"IMG_1900.jpeg" },
                { file:"IMG_1904.jpeg" },
                { file:"IMG_1919.jpeg" },
                { file:"IMG_2011.jpeg" },
                { file:"IMG_7337.jpeg" },
                { file:"IMG_7369.jpeg" },
                { file:"IMG_7509.jpeg" },
                { file:"IMG_7513.jpeg" },
                { file:"IMG_7516.jpeg" },
                { file:"IMG_7763.jpeg" },
                { file:"IMG_7790.jpeg" },
                { file:"IMG_7792.jpeg" },
                { file:"IMG_7793.jpeg" },
                { file:"IMG_7814.jpeg" },
                { file:"IMG_7817.jpeg" },
                { file:"IMG_7829.jpeg" },
                { file:"IMG_7835.jpeg" },
                { file:"IMG_7849.jpeg" },
                { file:"IMG_7864.jpeg" },
                { file:"IMG_7965.jpeg" },
                { file:"IMG_7999.jpeg" },
                { file:"IMG_8043.jpeg" },
                { file:"IMG_8085.jpeg" },
                { file:"IMG_8088.jpeg" },
                { file:"IMG_8103.jpeg" },
                { file:"IMG_8114.jpeg" },
                { file:"IMG_8117.jpeg" },
                { file:"IMG_8137.jpeg" },
                { file:"IMG_8149.jpeg" },
                { file:"IMG_8154.jpeg" }
            ],
            "Japan":     [
                /* files in /photos/japan/ */
            ],
            "Argentina": [
                /* files in /photos/argentina/ */
            ],
            "Untagged":  [
                { file:"thumb-1.jpg"   },
                { file:"thumb-2.jpeg"  },
                { file:"thumb-3.jpeg"  },
                { file:"thumb-4.jpeg"  },
                { file:"thumb-5.jpeg"  },
                { file:"thumb-6.jpeg"  },
                { file:"thumb-7.jpeg"  },
                { file:"thumb-8.jpeg"  },
                { file:"thumb-9.jpeg"  }
            ]
        };

        /* Preferred display order of the location chips.
           Locations not listed here fall to the end alphabetically. */
        var LOCATION_ORDER = ["Portugal","Brazil","Japan","Argentina","France","Denmark","Untagged"];

        /* ---------- Build a flat PHOTOS array from the manifest ---------- */
        var PHOTOS = [];
        FEATURED.forEach(function(p){
            PHOTOS.push({
                src: "photos/featured/" + p.file,
                caption: p.caption || "",
                location: p.location || "",
                featured: true
            });
        });
        Object.keys(LIBRARY).forEach(function(loc){
            var folder = "photos/" + loc.toLowerCase() + "/";
            LIBRARY[loc].forEach(function(p){
                PHOTOS.push({
                    src: folder + p.file,
                    caption: p.caption || "",
                    location: loc,
                    featured: false
                });
            });
        });

        /* ---------- Featured scroller ---------- */
        var featured = PHOTOS.filter(function(p){return p.featured});
        var scroller = document.getElementById("featuredScroller");
        var progress = document.getElementById("featuredProgress");
        var section  = document.getElementById("featuredSection");

        featured.forEach(function(p, idx){
            var el = document.createElement("div");
            el.className = "featured-item";
            el.setAttribute("data-idx", idx);
            el.innerHTML = '<img src="'+p.src+'" alt="'+esc(p.caption)+'" loading="lazy">' +
                           '<div class="featured-caption">'+
                             (p.location ? '<em>'+esc(p.location)+'</em>' : '') +
                             esc(p.caption) +
                           '</div>';
            el.addEventListener("click", function(){ openLightbox("featured", idx); });
            scroller.appendChild(el);
            var d = document.createElement("span");
            d.className = "p-dot"+(idx===0?" active":"");
            progress.appendChild(d);
        });

        /* Edge fade + progress dots respond to scroll position */
        function updateScrollState(){
            var maxScroll = scroller.scrollWidth - scroller.clientWidth;
            var s = scroller.scrollLeft;
            section.classList.toggle("has-left",  s > 8);
            section.classList.toggle("has-right", s < maxScroll - 8);
            /* Active dot = item closest to viewport center */
            var items = scroller.querySelectorAll(".featured-item");
            var center = s + scroller.clientWidth / 2;
            var closestIdx = 0, closestDist = Infinity;
            items.forEach(function(it, i){
                var mid = it.offsetLeft + it.offsetWidth / 2;
                var d = Math.abs(mid - center);
                if (d < closestDist) { closestDist = d; closestIdx = i; }
            });
            progress.querySelectorAll(".p-dot").forEach(function(dot, i){
                dot.classList.toggle("active", i === closestIdx);
            });
        }
        scroller.addEventListener("scroll", updateScrollState);
        window.addEventListener("resize", updateScrollState);
        setTimeout(updateScrollState, 100);

        /* Arrow buttons: scroll by ~ one item + gap */
        function itemStep(){
            var first = scroller.querySelector(".featured-item");
            if (!first) return 300;
            var gap = 12;
            return first.offsetWidth + gap;
        }
        document.getElementById("featuredPrev").addEventListener("click", function(){
            scroller.scrollBy({ left: -itemStep(), behavior: "smooth" });
        });
        document.getElementById("featuredNext").addEventListener("click", function(){
            scroller.scrollBy({ left:  itemStep(), behavior: "smooth" });
        });

        /* Click-and-drag scrolling on desktop */
        var isDown=false, startX=0, startScroll=0, moved=false;
        scroller.addEventListener("mousedown", function(e){
            isDown=true; moved=false;
            startX = e.pageX - scroller.offsetLeft;
            startScroll = scroller.scrollLeft;
            scroller.classList.add("dragging");
        });
        scroller.addEventListener("mouseleave", function(){ isDown=false; scroller.classList.remove("dragging"); });
        scroller.addEventListener("mouseup", function(){ isDown=false; scroller.classList.remove("dragging"); });
        scroller.addEventListener("mousemove", function(e){
            if (!isDown) return;
            var x = e.pageX - scroller.offsetLeft;
            var walk = (x - startX);
            if (Math.abs(walk) > 5) moved = true;
            scroller.scrollLeft = startScroll - walk;
        });
        /* Suppress click if it was actually a drag */
        scroller.addEventListener("click", function(e){
            if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
        }, true);

        /* ---------- Library ---------- */
        var library = PHOTOS.filter(function(p){ return !p.featured; });
        var locations = [];
        library.forEach(function(p){
            var loc = p.location || "Untagged";
            if (locations.indexOf(loc) === -1) locations.push(loc);
        });
        /* sort by preferred order */
        locations.sort(function(a,b){
            var ai = LOCATION_ORDER.indexOf(a), bi = LOCATION_ORDER.indexOf(b);
            if (ai === -1 && bi === -1) return a.localeCompare(b);
            if (ai === -1) return 1;
            if (bi === -1) return -1;
            return ai - bi;
        });

        var currentLoc = locations[0] || "Untagged";
        var libraryContext = [];  // photos in current filter, in order shown

        var locMenu = document.getElementById("locMenu");
        var grid = document.getElementById("grid");
        var libTitle = document.getElementById("libraryTitle");
        var libCount = document.getElementById("libraryCount");

        /* "All" chip */
        var allChip = document.createElement("button");
        allChip.className = "loc-chip";
        allChip.innerHTML = 'All <span class="loc-count">'+library.length+'</span>';
        allChip.addEventListener("click", function(){ selectLocation("All"); });
        locMenu.appendChild(allChip);
        /* Per-location chips */
        locations.forEach(function(loc){
            var count = library.filter(function(p){return p.location === loc}).length;
            var c = document.createElement("button");
            c.className = "loc-chip";
            c.innerHTML = esc(loc) + ' <span class="loc-count">'+count+'</span>';
            c.addEventListener("click", function(){ selectLocation(loc); });
            locMenu.appendChild(c);
        });

        function selectLocation(loc){
            currentLoc = loc;
            locMenu.querySelectorAll(".loc-chip").forEach(function(c){
                var label = c.textContent.trim().replace(/\s+\d+$/,'').trim();
                c.classList.toggle("on", label === loc);
            });
            libraryContext = (loc === "All")
                ? library.slice()
                : library.filter(function(p){ return p.location === loc; });
            libTitle.textContent = loc === "All" ? "Library" : loc;
            libCount.textContent = libraryContext.length + (libraryContext.length === 1 ? " photo" : " photos");
            grid.innerHTML = "";
            if (!libraryContext.length){
                var empty = document.createElement("div");
                empty.className = "empty-msg";
                empty.textContent = "No photos yet.";
                grid.appendChild(empty);
                return;
            }
            libraryContext.forEach(function(p, i){
                var el = document.createElement("div");
                el.className = "grid-item";
                el.innerHTML = '<img src="'+p.src+'" alt="'+esc(p.caption)+'" loading="lazy">';
                el.addEventListener("click", function(){ openLightbox("library", i); });
                grid.appendChild(el);
            });
        }
        selectLocation(currentLoc);

        /* ---------- Lightbox ---------- */
        var lb = document.getElementById("lightbox");
        var lbImg = document.getElementById("lbImg");
        var lbCaption = document.getElementById("lbCaption");
        var lbLoc = document.getElementById("lbLoc");
        var lbCounter = document.getElementById("lbCounter");
        var lbContext = [];
        var lbIndex = 0;

        function openLightbox(source, idx){
            lbContext = (source === "featured") ? featured.slice() : libraryContext.slice();
            lbIndex = idx;
            showLb();
            lb.classList.add("open");
            document.body.classList.add("lb-open");
        }
        function showLb(){
            if (!lbContext.length) return;
            if (lbIndex < 0) lbIndex = lbContext.length - 1;
            if (lbIndex >= lbContext.length) lbIndex = 0;
            var p = lbContext[lbIndex];
            lbImg.src = p.src;
            lbImg.alt = p.caption || "";
            lbCaption.textContent = p.caption || "";
            lbLoc.textContent = p.location || "";
            lbCounter.textContent = (lbIndex+1) + " / " + lbContext.length;
        }
        function closeLightbox(){
            lb.classList.remove("open");
            document.body.classList.remove("lb-open");
        }
        document.getElementById("lbClose").addEventListener("click", closeLightbox);
        document.getElementById("lbPrev").addEventListener("click", function(){ lbIndex--; showLb(); });
        document.getElementById("lbNext").addEventListener("click", function(){ lbIndex++; showLb(); });
        lb.addEventListener("click", function(e){ if (e.target === lb) closeLightbox(); });
        document.addEventListener("keydown", function(e){
            if (!lb.classList.contains("open")) return;
            if (e.key === "Escape") closeLightbox();
            else if (e.key === "ArrowLeft") { lbIndex--; showLb(); }
            else if (e.key === "ArrowRight") { lbIndex++; showLb(); }
        });

        function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
    })();
    </script>
</body>
</html>
